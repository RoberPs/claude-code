<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kōhi — Iniciar sesión</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <a class="brand brand-sm" href="index.html">Kōhi</a>

    <div class="card">
      <h2>Iniciar sesión</h2>
      <p class="muted">Consulta tu posición en la lista.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña">
        </div>

        <button class="btn btn-primary" type="submit" id="submitBtn">Entrar</button>
      </form>

      <div class="message" id="message" role="alert"></div>

      <p class="form-footer">¿Aún no estás en la lista? <a href="register.html">Únete</a></p>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage(message);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        return showMessage(message, 'Introduce tu email y tu contraseña.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando…';

      const { ok, status, data } = await api('/api/login', {
        method: 'POST',
        body: { email, password },
      });

      if (ok) {
        auth.set(data.token);
        window.location.href = 'dashboard.html';
        return;
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
      showMessage(
        message,
        status === 401 ? 'Email o contraseña incorrectos.' : data.error
      );
    });
  </script>
</body>
</html>
